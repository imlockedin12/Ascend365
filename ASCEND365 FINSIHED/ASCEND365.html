<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#09090c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ASCEND">
<meta name="description" content="ASCEND 365 — a personal operating system for a one-year transformation.">
<title>ASCEND 365</title>
<style>
/* ASCEND 365 — design system. Mobile-first (iPhone). Desktop shows a phone-sized test frame. */
:root{
  --bg:#09090c; --bg2:#0e0e13; --card:#14141a; --card2:#1a1a22; --card3:#22222c;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --text:#ededf3; --muted:#a1a1b3; --dim:#6c6c7e;
  --accent:#8b5cf6; --accent2:#a78bfa; --accent3:#c4b5fd; --glow:rgba(139,92,246,.35); --accentSoft:rgba(139,92,246,.14);
  --good:#34d399; --warn:#fbbf24; --bad:#f87171;
  --c-fitness:#fb7185; --c-tennis:#a3e635; --c-business:#fbbf24; --c-social:#38bdf8; --c-discipline:#a78bfa; --c-appearance:#2dd4bf; --c-learning:#94a3b8; --c-life:#8b8b9e; --c-recovery:#60a5fa;
  --r:18px; --r2:14px; --r3:10px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI Variable Display","Segoe UI",Inter,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
body.oled{--bg:#000;--bg2:#050507;--card:#0e0e12;--card2:#15151b;--card3:#1c1c24}
body.acc-indigo{--accent:#6366f1;--accent2:#818cf8;--accent3:#a5b4fc;--glow:rgba(99,102,241,.35);--accentSoft:rgba(99,102,241,.14)}
body.acc-magenta{--accent:#c026d3;--accent2:#e879f9;--accent3:#f0abfc;--glow:rgba(192,38,211,.32);--accentSoft:rgba(192,38,211,.14)}
body.acc-blue{--accent:#3b82f6;--accent2:#60a5fa;--accent3:#93c5fd;--glow:rgba(59,130,246,.32);--accentSoft:rgba(59,130,246,.14)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{font-size:16px} /* stops iOS zoom on focus */
a{color:var(--accent2)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#shell{position:fixed;inset:0;display:flex;justify-content:center;background:var(--bg)}
.app{position:relative;width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.app::before{content:"";position:absolute;inset:-20% -30% auto;height:420px;background:radial-gradient(ellipse at 50% 0%,var(--glow),transparent 62%);opacity:.55;pointer-events:none;z-index:0}
.topbar{position:relative;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 10px) 18px 10px;min-height:54px}
.topbar .back{width:34px;height:34px;border-radius:50%;border:0;background:var(--card2);display:grid;place-items:center;cursor:pointer}
.topbar h1{font-family:var(--display);font-size:22px;letter-spacing:-.02em;margin:0;flex:1;font-weight:700}
.topbar .lv{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:600;cursor:pointer}
.topbar .lv b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:linear-gradient(140deg,var(--accent2),var(--accent));color:#fff;font-size:11px}
.timerpill{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--accentSoft);color:var(--accent3);font-size:12px;font-weight:700;border:1px solid var(--glow);cursor:pointer}
.timerpill i{width:7px;height:7px;border-radius:50%;background:var(--accent2);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
#view{position:relative;z-index:1;flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px calc(96px + var(--safe-b));-webkit-overflow-scrolling:touch;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
.tabbar{position:absolute;z-index:20;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:8px 6px calc(8px + var(--safe-b));background:rgba(12,12,16,.82);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--dim);padding:4px 0;cursor:pointer;transition:color .2s}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--text)}
.tabbar button.on svg{color:var(--accent2);filter:drop-shadow(0 0 8px var(--glow))}

/* desktop test frame */
@media (min-width:760px){
  #shell{align-items:center;background:radial-gradient(circle at 30% 20%,#17121f,#060608 60%)}
  .app{max-width:400px;height:min(860px,94vh);border-radius:44px;border:1px solid #2a2a33;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 10px #0d0d11,0 0 0 11px #26262e}
  .deskNote{display:block!important}
}
.deskNote{display:none;position:fixed;left:24px;bottom:20px;max-width:260px;color:var(--dim);font-size:12px;line-height:1.5}
.deskNote b{color:var(--muted)}

/* ---------- primitives ---------- */
.card{position:relative;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.flat{background:var(--card)}
.card.hero{background:radial-gradient(120% 140% at 0% 0%,rgba(139,92,246,.22),transparent 55%),linear-gradient(180deg,var(--card2),var(--card));border-color:rgba(167,139,250,.18)}
.card h3{margin:0 0 10px;font-size:13px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.card h3 a,.card h3 button.link{font-size:12px;text-transform:none;letter-spacing:0;font-weight:600}
.sec{font-size:13px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
.sec .sp{flex:1}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:6px}
.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:12.5px} .tiny{font-size:11px}
.big{font-family:var(--display);font-size:30px;font-weight:750;letter-spacing:-.03em;line-height:1.05}
.mid{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .acc{color:var(--accent2)}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px}
.stat .k{font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-family:var(--display);font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.02em}
.stat .s{font-size:11.5px;color:var(--muted);margin-top:2px}
hr.l{border:0;border-top:1px solid var(--line);margin:12px 0}
.empty{padding:22px 12px;text-align:center;color:var(--dim);font-size:13px;border:1px dashed var(--line2);border-radius:var(--r2)}
.pill{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex:none;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--card3);color:var(--muted);border:1px solid var(--line)}
.pill.acc{background:var(--accentSoft);color:var(--accent3);border-color:transparent}
.pill.good{background:rgba(52,211,153,.12);color:var(--good);border-color:transparent}
.pill.warn{background:rgba(251,191,36,.12);color:var(--warn);border-color:transparent}
.pill.bad{background:rgba(248,113,113,.12);color:var(--bad);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:12px;padding:11px 16px;font-weight:650;font-size:14.5px;cursor:pointer;background:var(--card3);color:var(--text);transition:transform .12s var(--ease),background .2s;user-select:none}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;box-shadow:0 6px 20px -6px var(--glow)}
.btn.ghost{background:transparent;border:1px solid var(--line2)}
.btn.danger{background:rgba(248,113,113,.14);color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
button.link{background:none;border:0;color:var(--accent2);padding:0;cursor:pointer;font-weight:600}
.iconbtn{width:34px;height:34px;border-radius:10px;border:0;background:var(--card3);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.iconbtn:active{transform:scale(.94)}
.fab{position:absolute;right:18px;bottom:calc(84px + var(--safe-b));z-index:15;width:54px;height:54px;border-radius:18px;border:0;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;box-shadow:0 12px 30px -8px var(--glow);display:grid;place-items:center;cursor:pointer}

.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card3);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}

.bar{height:8px;border-radius:99px;background:var(--card3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s var(--ease)}
.bar.thin{height:5px}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .t{font-weight:600}
.li .s{font-size:12.5px;color:var(--muted)}
.chev{color:var(--dim);flex:none}

/* ---------- checklist ---------- */
.tl{position:relative}
.task{position:relative;display:flex;align-items:stretch;gap:12px;padding:0 0 0 0;margin-bottom:8px}
.task .time{width:50px;flex:none;text-align:right;padding-top:15px;font-size:12px;font-weight:650;color:var(--muted);font-variant-numeric:tabular-nums}
.task .time small{display:block;color:var(--dim);font-weight:500;font-size:10.5px}
.task .body{flex:1;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 10px 12px 12px;transition:background .35s,border-color .35s,opacity .35s;min-width:0}
.task .ttl{font-weight:620;font-size:14.5px;transition:color .3s}
.task .meta{font-size:11.5px;color:var(--dim);display:flex;gap:8px;align-items:center;margin-top:2px;flex-wrap:wrap}
.task .catbar{width:3px;align-self:stretch;border-radius:3px;flex:none}
.task.now .body{border-color:rgba(167,139,250,.45);box-shadow:0 0 0 1px rgba(167,139,250,.15),0 8px 24px -12px var(--glow)}
.task.now .time{color:var(--accent2)}
.task.done .body{background:linear-gradient(90deg,rgba(139,92,246,.10),var(--card) 60%)}
.task.done .ttl{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.task.skipped .body{opacity:.5}
.task.skipped .ttl{color:var(--dim)}
.chk{position:relative;width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--line2);background:transparent;cursor:pointer;display:grid;place-items:center;transition:border-color .2s,background .25s,transform .15s}
.chk:active{transform:scale(.88)}
.chk svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s var(--ease) .05s}
.done .chk{background:linear-gradient(135deg,var(--accent2),var(--accent));border-color:transparent;box-shadow:0 0 14px var(--glow)}
.done .chk svg{stroke-dashoffset:0}
.chk.pop{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.25)}100%{transform:scale(1)}}
.chk .ring{position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--accent2);opacity:0;pointer-events:none}
.chk.pop .ring{animation:ring .6s var(--ease)}
@keyframes ring{0%{opacity:.9;transform:scale(.8)}100%{opacity:0;transform:scale(1.9)}}
.skipico{width:30px;height:30px;flex:none;border-radius:50%;border:2px dashed var(--line2);display:grid;place-items:center;color:var(--dim);cursor:pointer;background:none}
.xpfloat{position:fixed;z-index:200;pointer-events:none;font-weight:800;font-size:14px;color:var(--accent3);text-shadow:0 0 12px var(--glow);animation:xpf 1.1s var(--ease) forwards}
@keyframes xpf{0%{opacity:0;transform:translateY(4px) scale(.8)}20%{opacity:1;transform:translateY(-6px) scale(1.05)}100%{opacity:0;transform:translateY(-38px) scale(1)}}
.nowline{display:flex;align-items:center;gap:8px;margin:2px 0 10px 18px;color:var(--accent2);font-size:11px;font-weight:700}
.nowline::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--accent2),transparent)}

/* ---------- sheet / modal ---------- */
.scrim{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.55);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;max-height:92%;display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .32s var(--ease);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--line2);margin:8px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:10px 18px 8px;flex:none}
.sheet .sh h2{margin:0;font-size:18px;flex:1;letter-spacing:-.01em}
.sheet .sb{overflow-y:auto;padding:4px 18px calc(18px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sheet .sf{display:flex;gap:8px;padding:10px 18px calc(12px + var(--safe-b));border-top:1px solid var(--line);flex:none}
.sheet .sf .btn{flex:1}

/* forms */
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fld>label{font-size:12px;color:var(--muted);font-weight:600}
.inp{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:11px 12px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent2)}
textarea.inp{min-height:84px;resize:vertical}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.chip.on{background:var(--accentSoft);border-color:var(--accent);color:var(--accent3)}
input[type=range]{width:100%;accent-color:var(--accent)}
.toggle{position:relative;width:48px;height:28px;flex:none;border-radius:99px;background:var(--card3);border:0;cursor:pointer;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .22s var(--ease)}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(20px)}
.scale{display:flex;gap:4px}
.scale button{flex:1;padding:9px 0;border-radius:9px;border:1px solid var(--line2);background:var(--card);font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.scale button.on{background:var(--accent);color:#fff;border-color:transparent}

/* toast + celebration */
.toast{position:absolute;left:50%;top:calc(var(--safe-t) + 12px);z-index:300;transform:translate(-50%,-20px);opacity:0;background:var(--card3);border:1px solid var(--line2);padding:10px 16px;border-radius:14px;font-size:13.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:all .3s var(--ease);max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}
.celebrate{position:absolute;inset:0;z-index:250;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(60,30,120,.92),rgba(5,5,8,.96) 70%);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transition:opacity .35s}
.celebrate.on{opacity:1}
.celebrate .cb{text-align:center;padding:30px;transform:scale(.9);transition:transform .45s var(--ease)}
.celebrate.on .cb{transform:none}
.celebrate .ico{width:92px;height:92px;margin:0 auto 16px;border-radius:28px;display:grid;place-items:center;font-size:44px;background:linear-gradient(140deg,var(--accent2),var(--accent));box-shadow:0 0 60px var(--glow)}
.celebrate h2{margin:0 0 6px;font-family:var(--display);font-size:26px;letter-spacing:-.02em}
.celebrate p{margin:0 0 20px;color:var(--muted)}
.celebrate canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--dim);font-size:10px;font-family:var(--font)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--card3)}
.ringwrap{position:relative;display:grid;place-items:center}
.ringwrap .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center}

/* misc components */
.kpi{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}
.kpi::-webkit-scrollbar{display:none}
.kpi .stat{min-width:118px;flex:none}
.tile{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r);background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);cursor:pointer;min-height:104px}
.tile .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center}
.tile .t{font-weight:700;font-size:14.5px}
.tile .s{font-size:12px;color:var(--muted)}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11px;color:var(--muted)}
.badge .b{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:24px;background:var(--card3);border:1px solid var(--line);filter:grayscale(1);opacity:.35}
.badge.got .b{filter:none;opacity:1;background:linear-gradient(140deg,rgba(167,139,250,.35),rgba(139,92,246,.12));border-color:rgba(167,139,250,.35);box-shadow:0 0 18px -4px var(--glow)}
.chapter{position:relative;padding-left:26px}
.chapter::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line2)}
.chapter .node{position:absolute;left:0;top:18px;width:18px;height:18px;border-radius:50%;background:var(--card3);border:2px solid var(--line2)}
.chapter.cur .node{background:var(--accent);border-color:var(--accent3);box-shadow:0 0 12px var(--glow)}
.chapter.past .node{background:var(--accent2);border-color:transparent}
.skill{display:flex;gap:12px;position:relative;padding-bottom:14px}
.skill .n{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--card3);border:2px solid var(--line2);z-index:1}
.skill.got .n{background:var(--accent);border-color:var(--accent3);color:#fff}
.skill.next .n{border-color:var(--accent2);color:var(--accent2);box-shadow:0 0 12px var(--glow)}
.skill.lock{opacity:.45}
.skill:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line2)}
.skill.got:not(:last-child)::before{background:var(--accent)}
.bubble{max-width:82%;padding:10px 13px;border-radius:18px;margin-bottom:8px;font-size:14.5px;line-height:1.38;animation:bin .3s var(--ease)}
@keyframes bin{from{opacity:0;transform:translateY(6px)}}
.bubble.me{margin-left:auto;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border-bottom-right-radius:6px}
.bubble.them{background:var(--card3);border-bottom-left-radius:6px}
.bubble.note{max-width:100%;background:none;color:var(--dim);font-size:12px;text-align:center;font-style:italic;padding:2px}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{50%{opacity:.25;transform:translateY(-2px)}}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0;padding:10px 0 4px;background:linear-gradient(transparent,var(--bg) 30%)}
.composer textarea{flex:1;min-height:44px;max-height:120px;resize:none}
.meter{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.photo{position:relative;border-radius:14px;overflow:hidden;background:var(--card3);aspect-ratio:3/4}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo span{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.6);padding:2px 7px;border-radius:7px}
.lockscreen{position:fixed;inset:0;z-index:999;background:var(--bg);display:grid;place-items:center}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin-top:20px}
.pinpad button{height:72px;border-radius:50%;border:1px solid var(--line2);background:var(--card);font-size:24px;font-weight:600;cursor:pointer}
.pindots{display:flex;gap:14px;justify-content:center}
.pindots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--line2)}
.pindots i.on{background:var(--accent2);border-color:transparent}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fadein{animation:fadein .35s var(--ease)}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}

body.rm *,body.rm *::before,body.rm *::after{animation-duration:.001s!important;transition-duration:.001s!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;transition-duration:.001s!important}}
/* v1.2 cleaner checklist */
.tl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 0;overflow:hidden}
.task{margin:0;align-items:center;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .time{width:54px;padding:0 0 0 14px;text-align:left;font-size:12.5px}
.task .body{background:none!important;border:0!important;border-radius:0;padding:13px 14px 13px 4px;box-shadow:none!important;gap:12px}
.task .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.task .chk{width:26px;height:26px}
.task.now .ttl{color:var(--accent3)}
.task.done .body{background:none}
.nowline{margin:0;padding:2px 14px;font-size:10px}
.nowline::after{opacity:.6}
button:focus:not(:focus-visible){outline:none}

</style>
</head>

  const addMonths = (k, n) => { const d = parse(k); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return key(d); };

  const today = () => key(new Date());
  const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const toMin = (t) => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + (m || 0); };
  const fromMin = (m) => pad(Math.floor(((m % 1440) + 1440) % 1440 / 60)) + ':' + pad(((m % 60) + 60) % 60);
  const fmtTime = (t) => { if (!t) return ''; let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return h + ':' + pad(m) + ' ' + ap; };

    appearance: { label: 'Appearance', color: 'var(--c-appearance)', hex: '#2dd4bf' },

  // ---------- charts (SVG strings) ----------

    if (!pts.length) return '<div class="empty">No data yet</div>';
    const W = 340, H = o.h || 150, pl = 34, pr = 10, pt = 12, pb = 22;
    const ys = pts.map((p) => p.y).filter((v) => v != null);
    let mn = o.min != null ? o.min : Math.min(...ys, o.goal != null ? o.goal : Infinity);
    let mx = o.max != null ? o.max : Math.max(...ys, o.goal != null ? o.goal : -Infinity);

    const col = o.color || 'var(--accent2)';
    const gid = 'lg' + Math.random().toString(36).slice(2, 6);

    pts.forEach((p, i) => { if (p.y == null) return; path += (path ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1); });

    let xl = ''; pts.forEach((p, i) => { if (i % step === 0 || (i === pts.length - 1 && lastOK(pts.length))) xl += `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${esc(p.x)}</text>`; });

    return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${o.fillColor || 'var(--accent)'}" stop-opacity=".35"/><stop offset="1" stop-color="${o.fillColor || 'var(--accent)'}" stop-opacity="0"/></linearGradient></defs>${grid}${goal}${area ? `<path d="${area}" fill="url(#${gid})"/>` : ''}<path d="${path}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg>`;
  };

    if (!pts.length) return '<div class="empty">No data yet</div>';
    const W = 340, H = o.h || 140, pl = o.noAxis ? 4 : 34, pr = 6, pt = 14, pb = 22;
    const mx = Math.max(o.max || 0, ...pts.map((p) => p.y), o.goal || 0) || 1;
    const bw = (W - pl - pr) / pts.length;
    const Y = (v) => pt + (1 - v / mx) * (H - pt - pb);

    },
    mount(root, r) {

      const m = findMs(); if (!m) return;

  const findMs = () => A.state.roadmap.milestones.find((m) => m.id === A.route().arg);

  function msDetail(id) {

<script>
/* ASCEND 365 — Tennis, Business & Wealth, Appearance & Style */
(function (A) {

      if (/(how('s| is| are| was)? (it going|you|your (day|night|week|weekend))|how you doing|how are things|what's up|whats up|what's new)/.test(lo)) { const h = hookFor(sim, sc); let s = tidy(sc.howareyou); if (h && tier !== 'cold') { s += ' ' + h.lines[0]; sim.revealed[h.k] = 1; sim.pending = [h.k]; } return { text: pre + s + (tier === 'warm' ? ' How about you?' : '') }; }
      if (/(what do you do|your job|where do you work|do you work|what do you study|in school|for work|for a living)/.test(lo)) { revealIn(sim, sc, sc.whatdo); return { text: pre + (tier === 'cold' ? firstSentence(sc.whatdo) : sc.whatdo) }; }
      if (/(where are you from|are you from|grow up|grew up|where do you live|from (around )?here)/.test(lo)) { revealIn(sim, sc, sc.from); return { text: pre + sc.from }; }
      if (/(keeping you busy|been up to|what's new|whats new|anything fun|plans for|this weekend|lately)/.test(lo)) { const h = hookFor(sim, sc); if (h) { sim.revealed[h.k] = 1; sim.pending = [h.k]; return { text: pre + pick(['Honestly? ', 'Hmm — ', 'Ha, okay: ']) + (tier === 'cold' ? firstSentence(h.lines[0]) : h.lines[0]) }; } }
      if (/(your name|who are you)/.test(lo)) return { text: pre + "I'm " + sc.name + '. ' + (/\b(i'm|im|my name)\b/.test(lo) ? 'Nice to meet you!' : "What's yours?") };
      const h = hookFor(sim, sc);
      if (a.closed && tier === 'cold') return { text: pre + pick(['Yeah.', 'Not really.', 'Kind of.']) };
      if (h) { sim.revealed[h.k] = 1; sim.pending = [h.k]; const l = tier === 'cold' ? firstSentence(h.lines[0]) : h.lines[0]; return { text: pre + (a.closed ? pick(['Yeah, kind of. ', 'Ha, sometimes. ', 'Not really, but ']) : pick(['Hmm. ', 'Ha — ', 'Oh — ', ''])) + l }; }
      return { text: pre + pick(["Ha, I feel like I've been doing all the talking. What about you — what's been keeping you busy?", "Honestly, not much else going on! What about you?"]), theyAsked: true };
    }
    if (a.low) { sim.lowStreak++; const out = { text: pre + pick(sc.cold) }; if (sim.lowStreak >= 2) out.note = `*${sc.name} glances at ${pos} phone*`; return out; }
    if (a.self) {
      if (tier === 'cold') return { text: pre + pick(['Oh, cool.', 'Nice.', 'Huh.']) };
      sim.theyAsked = true;
      return { text: pre + pick(["Ha, that's cool. ", 'Oh nice. ', 'Wait, really? ', "That's awesome. "]) + pick(['How did you get into that?', "What's that like?", 'How long have you been doing that?', 'What do you like most about it?', 'How did that happen?']) };
    }
    // plain statement / reaction
    if (tier === 'cold') return { text: pre + pick(sc.cold) };
    const cur = sim.pending[0] && sc.topics.find((t) => t.k === sim.pending[0]);
    if (cur && (sim.revealed[cur.k] || 0) < cur.lines.length && tier === 'warm') { const l = cur.lines[sim.revealed[cur.k]]; sim.revealed[cur.k]++; return { text: pre + pick(['Right?! ', 'Exactly. ', 'Ha, yes. ']) + l }; }
    return { text: pre + pick(['Ha, right?', 'Exactly.', 'Ha, true.', 'Right?']) };
  }

  function step(sim, text) {
    const sc = A.SCENARIOS.find((s) => s.id === sim.sid);
    sim.turn++;
    const a = A.analyzeMsg(text, sc, sim); a._lo = text.toLowerCase().replace(/[’‘]/g, "'");
    const pendingBefore = sim.pending.slice();
    sim.eng = A.clamp(sim.eng + engDelta(a, sim), 0, 100);
    sim.qStreak = a.q && !a.self ? sim.qStreak + 1 : 0;
    sim.meStreak = a.self && !a.q ? sim.meStreak + 1 : 0;
    if (!a.low) sim.lowStreak = 0;
    const pt = pendingBefore[0] && sc.topics.find((t) => t.k === pendingBefore[0]);
    const pendingOpen = !!(pt && (sim.revealed[pt.k] || 0) < pt.lines.length);
    sim.msgs.push({ who: 'me', text, a: Object.assign({}, a, { _lo: undefined }), pendingBefore, pendingOpen, engAfter: sim.eng });
    const r = partnerReply(sim, sc, a);
    if (r.declined) sim.eng = A.clamp(sim.eng - 5, 0, 100);
    if (r.pushed) sim.pushedAfterNo = true;
    const out = [{ who: 'them', text: r.text }];
    if (r.note) out.push({ who: 'note', text: r.note });
    sim.lastThem = r.text;
    if (r.end) { sim.ended = true; sim.outcome = r.end; }
    else if (sim.eng < 12 && sim.turn >= 3) { out.push({ who: 'them', text: sc.close.cold }); sim.ended = true; sim.outcome = 'fizzled'; }
    else if (sim.turn >= 14) { out.push({ who: 'them', text: sc.close[sim.eng >= 65 ? 'warm' : 'mid'] }); sim.ended = true; sim.outcome = 'time'; }
    else if (sim.turn >= 8 && sim.eng >= sc.thr && !sim.invitedTurn && !sim.hinted) { out.push({ who: 'them', text: "Anyway — I should probably head out soon." }); sim.hinted = true; sim.hintTurn = sim.turn; }
    if (!r.end && !r.declined && pendingBefore.length === 0 && sim.pending.length === 0) sim.pending = [];
    return out;
  }

  // ---------- coaching ----------
  const rewrite = (q) => {
    const lo = q.toLowerCase().replace(/\?+$/, '').trim(); let m;
    if ((m = lo.match(/^do you like (.+)/))) return 'What do you like about ' + m[1] + '?';
    if ((m = lo.match(/^do you (.+)/))) return 'How did you get into ' + m[1].replace(/^(play|do|have) /, '') + '?';
    if ((m = lo.match(/^did you (.+)/))) return 'How was ' + m[1].replace(/^(have|go to|go|enjoy|like) /, '') + '?';
    if (/^(are|is|was|were) /.test(lo)) return "What's that been like?";
    return "What's the story behind that?";
  };
  A.coach = (sim) => {
    const sc = A.SCENARIOS.find((s) => s.id === sim.sid);
    const me = sim.msgs.filter((m) => m.who === 'me'); const N = me.length || 1;
    const c = { open: 0, closed: 0, follow: 0, missed: [], self: 0, low: [], hedges: 0, humor: 0, negative: 0, longs: 0, disrespect: 0, pushy: 0 };
    let iStreak = 0, iMax = 0, mStreak = 0, mMax = 0, bestFollow = null, closedEx = null;
    me.forEach((m) => {
      const a = m.a; if (a.open) c.open++; else if (a.q) { c.closed++; if (!closedEx) closedEx = m.text; }
      if (a.follow) { c.follow++; if (!bestFollow || (a.open && !bestFollow.a.open)) bestFollow = m; }
      else if (m.pendingOpen && !a.bye && !a.invite) c.missed.push({ k: m.pendingBefore[0], text: m.text });
      if (a.self) c.self++; if (a.low) c.low.push(m.text); c.hedges += a.hedges; if (a.humor) c.humor++; c.negative += a.negative; if (a.words > 45) c.longs++;
      if (a.disrespect) c.disrespect++; if (a.pushy) c.pushy++;
      iStreak = a.q && !a.self ? iStreak + 1 : 0; iMax = Math.max(iMax, iStreak);
      mStreak = a.self && !a.q ? mStreak + 1 : 0; mMax = Math.max(mMax, mStreak);
    });
    const qRatio = (c.open + c.closed) / N; const first = me[0];
    const goodOpener = first && !first.a.greet && (first.a.q || first.a.topics.length || first.a.self);
    const success = sim.outcome === 'success';
    const s = {};
    s.flow = A.clamp(Math.round(30 + sim.eng * 0.45 + c.follow * 6 - c.low.length * 9 - (mMax >= 3 ? 10 : 0) - (sim.outcome === 'fizzled' ? 15 : 0)), 0, 100);
    s.listening = A.clamp(Math.round(25 + (c.follow / Math.max(1, c.follow + c.missed.length)) * 50 + (c.open / N) * 30 - (iMax >= 4 ? 10 : 0)), 0, 100);
    s.natural = A.clamp(Math.round(72 - Math.abs(qRatio - 0.5) * 50 - c.low.length * 8 - c.longs * 8 - (iMax >= 4 ? 10 : 0) + (c.self ? 8 : 0) + Math.min(6, c.humor * 3)), 0, 100);
    s.confidence = A.clamp(Math.round(42 + Math.min(24, c.self * 6) + (goodOpener ? 10 : 0) + (success ? 20 : sim.invitedTurn ? 10 : 0) - c.hedges * 5 - c.low.length * 4), 0, 100);
    s.respect = A.clamp(100 - c.disrespect * 60 - c.pushy * 25 - c.negative * 5 - (sim.pushedAfterNo ? 30 : 0), 0, 100);
    if (N < 5) s.flow = Math.max(0, s.flow - (5 - N) * 6);
    const overall = Math.round(s.flow * 0.25 + s.listening * 0.25 + s.natural * 0.2 + s.confidence * 0.15 + s.respect * 0.15);
    const fb = [];
    const T = (k) => sc.topics.find((t) => t.k === k);
    if (success) fb.push(['good', `${sc.name} said yes. You built enough rapport first (vibe ${sim.invitedEng}/100 when you asked) and made it easy to agree.`]);
    if (bestFollow) fb.push(['good', `“${bestFollow.text}” — you picked up on something ${sc.name} said and went deeper. That's the core skill.`]);
    if (goodOpener) fb.push(['good', 'Your opener gave them something to respond to instead of just "hey".']);
    else if (first && first.a.greet) fb.push(['try', 'You opened with just a greeting. Add something about the shared situation and a light question, e.g. comment on what is happening around you, then ask about it.']);
    if (c.missed.length) { const m = c.missed[0]; const t = T(m.k); if (t) fb.push(['try', `When ${sc.name} mentioned ${t.label}, you replied “${m.text.slice(0, 60)}${m.text.length > 60 ? '…' : ''}” and the thread dropped. Try: “${t.follow}”`]); }
    if (iMax >= 3) fb.push(['try', `You asked ${iMax} questions in a row without sharing anything about yourself. That starts to feel like an interview. Answer + share a bit + then ask.`]);
    if (mMax >= 3) fb.push(['try', `You shared about yourself ${mMax} times in a row without turning it back. After sharing, hand the conversation back with a question.`]);

    if (c.low.length) fb.push(['try', `“${c.low[0]}” gives them nothing to work with. React, then add a thought or a question.`]);
    if (c.hedges >= 2) fb.push(['try', 'Lots of hedging ("sorry", "idk", "I guess"). Say it plainly — you are allowed to take up space in a conversation.']);
    if (c.longs) fb.push(['try', 'Some messages were long. In real conversation, shorter turns keep it a back-and-forth.']);

  };

  A.socialLevel = () => { let lv = 1; for (const L of A.CHALLENGES) { const done = new Set(SO().challenges.filter((c) => c.lv === L.lv && c.went !== 'skip').map((c) => c.idx)).size; if (done >= A.CHALLENGE_UNLOCK && lv === L.lv && lv < 5) lv++; } return lv; };

    const idx = P[seed % P.length];

  // ---------- views ----------

    render(r) { if (r.sub === 'progress') return `<div class="row" style="margin-bottom:12px"><button class="btn sm ghost" data-go="social">${I('back', 14)} Social</button></div>` + progress(); return page(); },

    return `<div class="row" style="margin-bottom:12px;gap:10px"><button class="pill acc" data-act="ladder" style="border:0;cursor:pointer;padding:6px 12px">Level ${lv} · ${L.name} · ${n}/${A.CHALLENGE_UNLOCK}</button><span class="sp"></span><button class="link small" data-go="social/progress">Progress</button></div>
      ${chalCard()}

      <div class="card"><div class="list">${A.SCENARIOS.map((x) => { const runs = SO().sims.filter((y) => y.scenario === x.id); const best = runs.length ? Math.max(...runs.map((y) => y.overall)) : null; return `<div class="li" data-act="simstart" data-id="${x.id}"><span style="font-size:22px;width:28px;text-align:center">${x.icon}</span><div class="sp" style="min-width:0"><div class="t" style="font-size:14px">${esc(x.title)}</div><div class="s">${x.diff}${best != null ? ' · best ' + best : ''}</div></div>${I('chev', 16, 'class="chev"')}</div>`; }).join('')}</div></div>

        });

      } });
  };
  function sims() {
    const act = SO().active;
    return (act && !act.ended ? `<div class="card hero" data-go="sim/${act.sid}" style="cursor:pointer"><div class="row"><div class="sp"><b>Continue: ${esc(A.SCENARIOS.find((s) => s.id === act.sid).title)}</b><div class="small muted">${act.turn} messages in</div></div>${I('chev', 18, 'class="chev"')}</div></div>` : '') +
      `<p class="small muted" style="margin-top:0">Type what you'd actually say. The practice partner reacts to how you talk — follow-ups, open questions, sharing, pressure — and you get coaching at the end. It runs offline from rules, so treat it as reps, not a real person.</p>` +
      A.SCENARIOS.map((s) => { const runs = SO().sims.filter((x) => x.scenario === s.id); const best = runs.length ? Math.max(...runs.map((x) => x.overall)) : null; return `<div class="card" data-act="simstart" data-id="${s.id}" style="cursor:pointer"><div class="row"><div style="font-size:28px">${s.icon}</div><div class="sp"><div style="font-weight:700">${esc(s.title)}</div><div class="small muted">${esc(s.goal)}</div></div></div><div class="row" style="margin-top:10px;gap:6px"><span class="pill ${s.diff === 'Hard' ? 'warn' : s.diff === 'Medium' ? 'acc' : 'good'}">${s.diff}</span><span class="pill">${runs.length} run${runs.length === 1 ? '' : 's'}</span>${best != null ? `<span class="pill">Best ${best}</span>` : ''}</div></div>`; }).join('');

  sa.simstart = async (el) => {

  function xp() {

        <div class="card"><h3>Reminders</h3><div class="small muted">Home-screen web apps on iPhone can't schedule their own notifications without a push server, so there are no fake reminder toggles here. Use iPhone Clock alarms for wake-up and bedtime, and open ASCEND first thing — the dashboard always shows what's next.</div></div>

          <div class="grid2"><button class="btn" data-act="exp">${I('download', 16)} Export</button><button class="btn" data-act="expp">${I('camera', 16)} Export + photos</button></div>

    },
    mount(root, r) {

  async function applyRoutineToday(type) {

  }

<script>
/* ASCEND 365 — shell, router, focus timer, lock */
(function (A) {
  'use strict';
  const d = A.d;

  const TABS = [['home', 'home', 'Home'], ['day', 'day', 'My Day'], ['roadmap', 'map', 'Roadmap'], ['social', 'social', 'Social'], ['more', 'grid', 'More']];
  const PARENT = { fitness: 'more', tennis: 'more', biz: 'more', look: 'more', insights: 'more', settings: 'more', review: 'more', notes: 'more', year: 'roadmap', sim: 'social', lesson: 'social' };

  let cur = (location.hash || '#/home').slice(2) || 'home';
  A.route = () => { const h = cur.split('/'); return { name: h[0] || 'home', sub: h[1] || '', arg: h[2] || '' }; };
  A.go = (path) => { cur = path || 'home'; try { if (location.hash !== '#/' + cur) history.pushState(null, '', '#/' + cur); } catch (e) { /* sandboxed preview */ } A.render(); };

  let rendering = false, again = false;
  A.render = (keepScroll) => {

    if (again) { again = false; renderInner(true); }
  };
  function renderInner(keepScroll) {
    const r = A.route(); const v = A.views[r.name] || A.views.home;
    const root = document.getElementById('view'); const top = keepScroll ? root.scrollTop : 0;
    const li = A.levelInfo();
    const parent = PARENT[r.name];
    const title = typeof v.title === 'function' ? v.title(r) : v.title;
    document.getElementById('topbar').innerHTML =
      (parent ? `<button class="back" data-go="${parent}" aria-label="Back">${A.icon('back', 18)}</button>` : '') +
      `<h1>${title}</h1>` + timerPill() +
      `<div class="lv" data-go="home"><b>${li.lv}</b><span class="num">${A.fmtNum(li.xp)} XP</span></div>`;
    try { root.innerHTML = `<div class="${keepScroll ? '' : 'fadein'}">${v.render(r)}</div>`; }
    catch (e) { console.error(e); root.innerHTML = `<div class="card"><b>Something went wrong rendering this screen.</b><div class="small muted" style="margin-top:6px">${A.esc(e.message)}</div></div>`; }
    if (v.mount) v.mount(root, r);
    root.scrollTop = top;
    const tab = TABS.find((t) => t[0] === r.name) ? r.name : (PARENT[r.name] === 'home' ? 'home' : PARENT[r.name] || 'more');
    document.querySelectorAll('.tabbar button').forEach((b) => b.classList.toggle('on', b.dataset.go === tab));
    A.flushCeleb();
  }
  A.refresh = () => A.render(true);

  function timerPill() {
    const t = A.state.timer; if (!t) return '';
    const left = Math.max(0, t.dur * 60000 - elapsed(t));
    return `<div class="timerpill" data-act-global="timer"><i style="${t.startedAt ? '' : 'animation:none;opacity:.4'}"></i><span class="num" id="tpill">${fmtMs(left)}</span></div>`;
  }
  const elapsed = (t) => t.acc + (t.startedAt ? Date.now() - t.startedAt : 0);
  const fmtMs = (ms) => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + d.pad(s % 60); };

  // ---------- global click delegation ----------
  function onClick(e) {
    const an = e.target.closest('a[href^="#/"]');
    if (an) { e.preventDefault(); return A.go(an.getAttribute('href').slice(2)); }
    const go = e.target.closest('[data-go]');
    if (go) { e.preventDefault(); A.sfx('tick'); return A.go(go.dataset.go); }
    const g = e.target.closest('[data-act-global]');
    if (g) { const a = g.dataset.actGlobal; if (a === 'timer') return A.openTimer(); }
    const el = e.target.closest('[data-act]');
    if (el && document.getElementById('view').contains(el)) {
      const v = A.views[A.route().name];
      const fn = v && v.act && v.act[el.dataset.act];
      if (fn) { e.preventDefault(); fn(el, e); }
    }
    if (document.getElementById('view').contains(e.target)) A.bindFormBits(e);
  }

  // ---------- focus timer ----------
  A.focusProjects = () => {
    const ps = A.state.biz.projects.filter((p) => p.status === 'active').map((p) => [p.id, p.name]);
    return ps.concat([['research', 'Stock research'], ['other', 'Other / admin']]);
  };
  A.projectName = (id) => { const p = A.state.biz.projects.find((x) => x.id === id); return p ? p.name : id === 'research' ? 'Stock research' : id === 'other' ? 'Other / admin' : 'Project'; };
  let tick;
  A.openTimer = () => {
    const S = A.state;
    const body = () => {
      const t = S.timer;
      if (!t) return `<p class="muted small" style="margin-top:0">One project per session. The deep-work XP cap is ${S.settings.deepCapMin / 60}h/day so you're never rewarded for burning out.</p>` +
        A.fields([{ n: 'project', l: 'Project', t: 'select', o: A.focusProjects(), v: A.focusProjects()[0][0] }, { n: 'dur', l: 'Length', t: 'chips', o: [[25, '25 min'], [50, '50 min'], [90, '90 min']], v: 50 }, { n: 'label', l: 'Session goal (optional)', ph: 'e.g. finish the data loader' }]);
      const p = elapsed(t) / (t.dur * 60000);
      return `<div style="display:grid;place-items:center;padding:8px 0 4px">${A.chart.ring(Math.min(1, p), 210, 12, 'url(#rg)', `<div><div class="big num" id="tbig">${fmtMs(Math.max(0, t.dur * 60000 - elapsed(t)))}</div><div class="small muted">${A.esc(A.projectName(t.project))}</div>${t.label ? `<div class="tiny dim" style="max-width:150px">${A.esc(t.label)}</div>` : ''}</div>`)}</div>`;
    };
    const foot = () => S.timer ? [{ label: 'Stop & log', act: 'stop' }, { label: S.timer.startedAt ? 'Pause' : 'Resume', cls: 'pri', act: 'pause' }] : [{ label: 'Log past session', act: 'manual' }, { label: 'Start focus', cls: 'pri', act: 'start' }];
    const sh = A.sheet({
      title: 'Focus timer', body: body(), foot: foot(),
      onMount: (el) => { clearInterval(tick); tick = setInterval(() => { const b = el.querySelector('#tbig'); if (b && S.timer) { b.textContent = fmtMs(Math.max(0, S.timer.dur * 60000 - elapsed(S.timer))); const ring = el.querySelector('.ringfg'); if (ring) ring.style.strokeDashoffset = ring.dataset.c * (1 - Math.min(1, elapsed(S.timer) / (S.timer.dur * 60000))); } }, 500); },
      onClose: () => clearInterval(tick),
      onAction: (a, el, close) => {
        if (a === 'start') { const f = A.read(el); S.timer = { project: f.project, dur: Number(f.dur) || 50, label: f.label, startedAt: Date.now(), acc: 0, day: d.today() }; A.save(); A.sfx('done'); close(); A.refresh(); }
        if (a === 'pause') { const t = S.timer; if (t.startedAt) { t.acc += Date.now() - t.startedAt; t.startedAt = null; } else t.startedAt = Date.now(); A.save(); close(); A.refresh(); }
        if (a === 'stop') { close(); finishTimer(true); }
        if (a === 'manual') { close(); A.manualFocus(); }
      }
    });
    return sh;
  };
  function finishTimer(early) {
    const t = A.state.timer; if (!t) return;
    const min = Math.round(Math.min(elapsed(t), t.dur * 60000) / 60000);
    A.state.timer = null;
    if (min < 5) { A.save(); A.toast('Session under 5 min — not logged'); A.refresh(); return; }
    const delta = A.addFocus({ date: t.day || d.today(), min, project: t.project, note: t.label || '' });
    A.sfx('done'); A.toast(`Logged ${min} min focus${delta > 0 ? ' · +' + delta + ' XP' : ' (daily XP cap reached)'}`);
    A.refresh();
  }
  A.manualFocus = (pre = {}) => {
    A.sheet({ title: 'Log focus session', body: A.fields([{ n: 'project', l: 'Project', t: 'select', o: A.focusProjects(), v: pre.project }, [{ n: 'date', l: 'Date', t: 'date', v: pre.date || d.today() }, { n: 'min', l: 'Minutes', t: 'number', v: pre.min || 60, min: 5 }], { n: 'note', l: 'What did you get done?', t: 'textarea', ph: 'Optional' }]),
      foot: [{ label: 'Save', cls: 'pri', act: 'save' }],
      onAction: (a, el, close) => { const f = A.read(el); if (!f.min || f.min < 1) return A.toast('Enter minutes'); const delta = A.addFocus({ date: f.date, min: f.min, project: f.project, note: f.note }); close(); A.toast('Session logged' + (delta > 0 ? ' · +' + delta + ' XP' : '')); A.refresh(); } });
  };
  setInterval(() => {
    const t = A.state && A.state.timer; if (!t) return;
    const p = document.getElementById('tpill'); const left = t.dur * 60000 - elapsed(t);
    if (p) p.textContent = fmtMs(Math.max(0, left));
    if (left <= 0 && t.startedAt) { A.celebrate({ icon: '🧠', title: 'Focus block complete', sub: t.dur + ' minutes on ' + A.projectName(t.project) + '. Take a real break.', btn: 'Log it' }).then(() => finishTimer()); t.startedAt = null; t.acc = t.dur * 60000; }
  }, 1000);

  // ---------- lock screen ----------
  function lockScreen() {
    return new Promise((res) => {
      const el = document.createElement('div'); el.className = 'lockscreen'; let pin = '';
      const draw = () => { el.innerHTML = `<div style="text-align:center"><div style="color:var(--accent2)">${A.icon('lock', 34)}</div><div class="mid" style="margin:10px 0 18px">ASCEND 365</div><div class="pindots">${[0, 1, 2, 3].map((i) => `<i class="${i < pin.length ? 'on' : ''}"></i>`).join('')}</div><div class="pinpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, '⌫'].map((n) => `<button data-n="${n}" ${n === '' ? 'style="visibility:hidden"' : ''}>${n}</button>`).join('')}</div></div>`; };
      draw(); document.body.appendChild(el);
      el.onclick = async (e) => {
        const b = e.target.closest('button'); if (!b) return; const n = b.dataset.n;
        if (n === '⌫') pin = pin.slice(0, -1); else if (pin.length < 4) pin += n;
        draw();
        if (pin.length === 4) { if ((await A.sha(pin)) === A.state.settings.pinHash) { el.remove(); res(); } else { pin = ''; draw(); el.querySelector('.pindots').classList.add('shake'); } }
      };
    });
  }

  // ---------- boot ----------
  A.applyTheme = () => { const s = A.state.settings; document.body.classList.toggle('oled', !!s.oled); document.body.classList.toggle('rm', !!s.reducedMotion); ['indigo', 'magenta', 'blue'].forEach((c) => document.body.classList.toggle('acc-' + c, s.accent === c)); };
  async function boot() {
    A.load(); A.applyTheme();
    document.getElementById('tabbar').innerHTML = TABS.map(([k, ic, l]) => `<button data-go="${k}">${A.icon(ic, 23)}<span>${l}</span></button>`).join('');
    document.addEventListener('click', onClick);
    const fromHash = () => { const h = (location.hash || '').slice(2); if (h && h !== cur) { cur = h; A.render(); } };
    window.addEventListener('hashchange', fromHash); window.addEventListener('popstate', fromHash);
    if (A.state.settings.pinHash) await lockScreen();
    A.ensureDay(d.today()); A.after(null);
    A.render();
    // day rollover while the app stays open
    let lastDay = d.today();
    setInterval(() => { if (d.today() !== lastDay) { lastDay = d.today(); A.ensureDay(lastDay); A.refresh(); } }, 30000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && d.today() !== lastDay) { lastDay = d.today(); A.ensureDay(lastDay); A.render(); } });
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  document.addEventListener('DOMContentLoaded', boot);
})(window.A);

</script>
</body>
</html>
